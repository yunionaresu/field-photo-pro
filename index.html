<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Field Camera Pro</title>

  <style>
    :root {
      --primary: #E11D48;
      --primary-dark: #BE123C;
      --bg-light: #F1F5F9;
      --surface: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; overscroll-behavior: none; }
    
    #app { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
    
    /* 🔴 メイン撮影領域（背景が赤＝全部シャッター） */
    #captureArea { 
      flex: 1; display: flex; flex-direction: column;
      background: var(--primary); 
      position: relative; cursor: pointer; transition: background 0.1s;
    }
    #captureArea:active { background: var(--primary-dark); }
    
    /* 📸 カメラコンテナ（黒帯排除・アスペクト比連動） */
    #cameraWrapper {
      flex: 1; display: flex; justify-content: center; align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(30px, env(safe-area-inset-right)) 24px max(30px, env(safe-area-inset-left));
      position: relative; z-index: 5; pointer-events: none;
    }
    #cameraStage {
      /* アスペクト比はJSで動的設定 */
      max-width: 100%; max-height: 100%; background: #000;
      border-radius: 12px; overflow: hidden; position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); pointer-events: auto; cursor: crosshair;
    }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    
    /* 🔤 長辺のみ表示するテキスト */
    .shutter-text { position: absolute; color: rgba(255,255,255,0.85); font-weight: 800; font-size: 0.95rem; letter-spacing: 0.15em; pointer-events: none; white-space: nowrap; }
    .text-top { top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: none; }
    .text-bottom { bottom: 12px; left: 50%; transform: translateX(-50%); display: none; }
    .text-left { left: max(10px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; }
    .text-right { right: max(10px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; }

    /* 🎛 フォーカス＆スライダーUI */
    #focusUI { position: absolute; display: none; transform: translate(-50%, -50%); z-index: 20; }
    .focus-ring { width: 70px; height: 70px; border: 1.5px solid #FFD60A; box-shadow: 0 0 4px rgba(0,0,0,0.5); position: relative; animation: focusAnim 0.3s ease-out forwards; }
    @keyframes focusAnim { 0% { transform: scale(1.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    
    /* スライダー共通 */
    input[type=range] { -webkit-appearance: none; background: transparent; position: absolute; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #FFD60A; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.5); border-radius: 2px; }
    /* 縦 (明るさ・フラッシュ) */
    #sliderBright { width: 120px; right: -75px; top: 25px; transform: rotate(-90deg); transform-origin: left center; }
    /* 横 (ピント/ズーム) */
    #sliderFocus { width: 120px; left: -25px; bottom: -30px; }

    /* 🎨 オーバーレイ（スタンプ等） */
    .overlay-ui { position: absolute; z-index: 10; pointer-events: none; }
    #stampPreview { display: none; padding: 8px 16px; border-radius: 8px; background: rgba(0,0,0,0.85); border: 2px solid #fff; color: #fff; font-weight: 800; font-size: 1.2rem; }
    #shapePreview { display: none; transform-origin: center center; position: absolute; z-index: 11; }

    /* 🧰 下部コントロールパネル（縦画面時は下、横画面時は右） */
    #toolsPanel { background: var(--surface); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; cursor: default; }
    .tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tool-btn { height: 46px; background: var(--bg-light); border: 1.5px solid var(--border); border-radius: 12px; color: var(--text-main); font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .tool-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .btn-gallery { height: 36px; padding: 0 16px; background: var(--text-main); color: #fff; border-radius: 8px; font-weight: bold; border: none; }

    /* 📱 画面の向きに応じたレイアウト切り替え */
    @media (orientation: landscape) {
      #app { flex-direction: row; }
      .text-left, .text-right { display: none; }
      .text-top, .text-bottom { display: block; }
      #toolsPanel { width: 300px; padding: 16px max(16px, env(safe-area-inset-right)) 16px 16px; border-left: 2px solid var(--border); justify-content: center; }
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
    }

    #flashEffect { position: fixed; inset: 0; background: #fff; z-index: 9000; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
    #toast { position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9999; background: rgba(255,255,255,0.95); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 800; display: none; }
  </style>
</head>
<body>

<div id="flashEffect"></div>
<div id="toast"></div>

<div id="app">
  <!-- 🔴 メイン撮影領域 -->
  <div id="captureArea" onclick="capturePhoto()">
    
    <!-- 長辺テキスト -->
    <div class="shutter-text text-top">赤いところはぜんぶシャッター</div>
    <div class="shutter-text text-bottom">赤いところはぜんぶシャッター</div>
    <div class="shutter-text text-left">赤いところはぜんぶシャッター</div>
    <div class="shutter-text text-right">赤いところはぜんぶシャッター</div>

    <div id="cameraWrapper">
      <!-- 📸 ファインダー (クリック伝播ストップでシャッター回避) -->
      <div id="cameraStage" onclick="handleFocus(event)">
        <video id="video" autoplay playsinline muted></video>
        
        <div id="stampPreview" class="overlay-ui"></div>
        <div id="shapePreview">
          <svg id="svgArrow" width="100" height="100" viewBox="-50 -50 100 100" style="display:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">
            <path d="M-40,0 L15,0 M15,-15 L40,0 L15,15 Z" fill="#E11D48" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
            <path d="M-40,0 L15,0 M15,-15 L40,0 L15,15 Z" fill="#E11D48" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />
          </svg>
        </div>

        <!-- 🎛 タップフォーカスUI -->
        <div id="focusUI" onclick="event.stopPropagation()">
          <div class="focus-ring"></div>
          <input type="range" id="sliderBright" min="0.5" max="2.0" step="0.1" value="1.0">
          <input type="range" id="sliderFocus" min="1" max="3" step="0.1" value="1.0">
        </div>
      </div>
    </div>
  </div>

  <!-- 🧰 下部（右部）ツールパネル -->
  <section id="toolsPanel" onclick="event.stopPropagation()">
    <div class="panel-header">
      <div style="color:var(--text-main); font-weight:800;">ツール・スタンプ</div>
      <button class="btn-gallery" onclick="alert('※このモックでは一覧は省略されています')">一覧(<span id="gCount">0</span>)</button>
    </div>
    <div class="tools-grid">
      <button class="tool-btn" data-stamp="作業前">作業前</button>
      <button class="tool-btn" data-stamp="作業中">作業中</button>
      <button class="tool-btn" data-stamp="作業後">作業後</button>
      <button class="tool-btn" data-stamp="その他">その他</button>
    </div>
    <div class="tools-grid">
      <button class="tool-btn" data-shape="arrow">➜ 矢印</button>
      <button class="tool-btn" data-shape="circle">〇 円</button>
      <button class="tool-btn" data-pos="top-left">↖ 左上</button>
      <button class="tool-btn" data-pos="bottom-right">↘ 右下</button>
    </div>
  </section>
</div>

<script>
let stream, currentStamp = null, stampPos = "top-left", activeShape = null;
let currentBrightness = 1.0, currentZoom = 1.0;
const video = document.getElementById("video");
const cameraStage = document.getElementById("cameraStage");
const focusUI = document.getElementById("focusUI");
let photosCount = 0;

// カメラ起動
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject = stream;
  } catch(e) { toast("カメラを許可してください"); }
}
startCamera();

// アスペクト比を動画ソースに合わせる（黒帯排除）
video.addEventListener('loadedmetadata', () => {
  const w = video.videoWidth;
  const h = video.videoHeight;
  cameraStage.style.aspectRatio = `${w} / ${h}`;
});

// ツールイベント
document.querySelectorAll("[data-stamp]").forEach(b => b.onclick = () => {
  currentStamp = currentStamp === b.dataset.stamp ? null : b.dataset.stamp; updateUI();
});
document.querySelectorAll("[data-shape]").forEach(b => b.onclick = () => {
  activeShape = activeShape === b.dataset.shape ? null : b.dataset.shape; updateUI();
});
document.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => {
  stampPos = b.dataset.pos; updateUI();
});

function updateUI() {
  document.querySelectorAll("[data-stamp]").forEach(b => b.classList.toggle("active", b.dataset.stamp === currentStamp));
  document.querySelectorAll("[data-pos]").forEach(b => b.classList.toggle("active", b.dataset.pos === stampPos));
  document.querySelectorAll("[data-shape]").forEach(b => b.classList.toggle("active", b.dataset.shape === activeShape));
  
  const sp = document.getElementById("stampPreview");
  if(currentStamp) {
    sp.style.display = "block"; sp.textContent = currentStamp;
    sp.style.left = "auto"; sp.style.right = "auto"; sp.style.top = "auto"; sp.style.bottom = "auto";
    if(stampPos === "top-left") { sp.style.top="12px"; sp.style.left="12px"; }
    else { sp.style.bottom="12px"; sp.style.right="12px"; }
  } else sp.style.display = "none";
}

// 🎛 タップフォーカス機能
let focusTimer;
function handleFocus(e) {
  e.stopPropagation(); // シャッター起動をブロック
  const r = cameraStage.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  
  focusUI.style.display = "block";
  focusUI.style.left = `${x}px`;
  focusUI.style.top = `${y}px`;
  
  // 5秒操作がなければ枠を消す
  clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { focusUI.style.display = "none"; }, 5000);
}

// 縦スライダー：明るさ補正 & フラッシュ(Torch)
document.getElementById("sliderBright").addEventListener('input', async (e) => {
  clearTimeout(focusTimer); focusTimer = setTimeout(() => { focusUI.style.display = "none"; }, 5000);
  currentBrightness = parseFloat(e.target.value);
  video.style.filter = `brightness(${currentBrightness})`;
  
  // フラッシュ制御 (明るさ1.8以上でON)
  const track = stream?.getVideoTracks()[0];
  if(track && track.getCapabilities().torch !== undefined) {
    try { await track.applyConstraints({ advanced: [{ torch: currentBrightness >= 1.8 }] }); } catch(err){}
  }
});

// 横スライダー：ピント(Zoom API)
document.getElementById("sliderFocus").addEventListener('input', async (e) => {
  clearTimeout(focusTimer); focusTimer = setTimeout(() => { focusUI.style.display = "none"; }, 5000);
  currentZoom = parseFloat(e.target.value);
  
  const track = stream?.getVideoTracks()[0];
  if(track && track.getCapabilities().zoom !== undefined) {
    try { await track.applyConstraints({ advanced: [{ zoom: currentZoom }] }); } catch(err){}
  }
});

// 📸 撮影処理 (フィルタをCanvasに焼き込む)
function capturePhoto() {
  if(!video.videoWidth) return;
  const flash = document.getElementById("flashEffect");
  flash.style.opacity = "1"; setTimeout(() => flash.style.opacity = "0", 100);

  const cvs = document.createElement("canvas");
  const ctx = cvs.getContext("2d");
  cvs.width = video.videoWidth; cvs.height = video.videoHeight;
  
  // 明るさを適用して描画
  ctx.filter = `brightness(${currentBrightness})`;
  ctx.drawImage(video, 0, 0, cvs.width, cvs.height);
  ctx.filter = "none";

  if(currentStamp) drawStamp(ctx, currentStamp, cvs.width, cvs.height);

  photosCount++;
  document.getElementById("gCount").textContent = photosCount;
  toast("写真を保存しました");
}

function drawStamp(ctx, txt, w, h) {
  const fz = Math.max(38, Math.round(w * 0.038)), pad = fz * 0.4, m = Math.round(w * 0.025);
  ctx.font = `bold ${fz}px sans-serif`;
  const boxW = ctx.measureText(txt).width + pad * 2, boxH = fz + pad * 2;
  let x = m, y = m;
  if(stampPos === "bottom-right") { x = w - boxW - m; y = h - boxH - m; }
  ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(3, w * 0.003); ctx.strokeRect(x, y, boxW, boxH);
  ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(txt, x + pad, y + boxH / 2);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>t.style.display="none", 2000);
}
</script>
</body>
</html>
