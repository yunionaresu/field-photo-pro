<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Field Camera</title>

  <style>
    :root {
      --primary: #E11D48;
      --primary-dark: #BE123C;
      --bg-dark: #000000;
      --bg-light: #F1F5F9;
      --surface: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --border: #E2E8F0;
      --radius-md: 12px;
      --shadow-md: 0 12px 32px rgba(0,0,0,0.15);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; background: var(--bg-dark); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
    
    .icon { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    
    #app { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
    
    /* 🪟 Header */
    .header { 
      padding-top: env(safe-area-inset-top); 
      height: calc(54px + env(safe-area-inset-top)); 
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      display: flex; align-items: center; justify-content: space-between; z-index: 10; flex-shrink: 0; background: var(--bg-dark); 
    }
    .header.edit-mode { background: var(--surface); color: var(--text-main); border-bottom: 1px solid var(--border); }
    
    .header-actions { display: flex; gap: 8px; align-items: center; width: 100%; justify-content: space-between; }
    .header-btn { height: 36px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,0.2); font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; cursor: pointer; color: #fff; border: none; white-space: nowrap; }
    .header-btn.primary { background: var(--primary); }
    .header.edit-mode .header-btn { background: var(--bg-light); color: var(--text-main); border: 1px solid var(--border); }
    
    /* =====================================
       📷 Main Content & Layout
       ===================================== */
    #mainContent { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; background: var(--bg-dark); transition: background 0.2s; }
    #mainContent.edit-mode { background: var(--bg-light); }
    
    /* 🔴 丸型シャッターボタン (純正カメラ風) */
    .shutter-circle-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background-color: #fff; border: 3px solid #cbd5e1;
      box-shadow: 0 0 0 4px var(--bg-dark) inset, 0 4px 12px rgba(0,0,0,0.3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; padding: 0;
    }
    .shutter-circle-btn:active { transform: scale(0.92); }
    .shutter-icon { display: none; width: 28px; height: 28px; color: #fff; }
    
    /* 編集モード時のシャッターボタン (上書き保存に変化) */
    .shutter-circle-btn.edit-save {
      background-color: var(--text-main); border-color: var(--text-main); box-shadow: none;
    }
    .shutter-circle-btn.edit-save .shutter-icon { display: block; }

    /* シャッターコンテナ */
    .alt-shutter-container { padding: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; }
    .shutter-wrapper { display: flex; justify-content: center; align-items: center; padding: 4px 0; flex-shrink: 0; }

    /* 🔲 カメラ・ファインダー領域 */
    #cameraArea { 
      flex: 1; display: flex; justify-content: center; align-items: center;
      padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); 
      position: relative; min-height: 0; min-width: 0; overflow: hidden;
    }
    
    #cameraWrapper {
      position: relative; width: 100%; height: 100%; max-width: 100%; max-height: 100%;
      background: #000; border-radius: 8px; overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); pointer-events: auto;
      display: flex; justify-content: center; align-items: center;
    }
    #mainContent.edit-mode #cameraWrapper { box-shadow: var(--shadow-md); border: 1px solid var(--border); }
    
    #video, #editorImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    #editorImg { display: none; }

    /* 🎨 オーバーレイ UI */
    .overlay-ui { position: absolute; z-index: 20; pointer-events: none; }
    #stampPreview { display: none; padding: 6px 14px; border-radius: 6px; background: rgba(0,0,0,0.85); border: 2px solid #fff; color: #fff; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.05em; }
    #shapePreview { position: absolute; z-index: 21; display: none; transform-origin: center center; pointer-events: none; }

    /* =====================================
       🎛 ツールパネル
       ===================================== */
    #toolsPanel { background: transparent; padding: 8px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; z-index: 25; }
    #mainContent.edit-mode #toolsPanel { background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }

    .tools-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    
    /* ツールボタン (ダーク/ライト対応) */
    .tool-btn { height: 42px; background: #1e293b; border: 1.5px solid #334155; border-radius: 8px; color: #f8fafc; font-weight: 800; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; }
    .tool-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    
    #mainContent.edit-mode .tool-btn { background: var(--bg-light); border-color: var(--border); color: var(--text-main); }
    #mainContent.edit-mode .tool-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* =====================================
       📱 Landscape Mode (横画面)
       ===================================== */
    @media (orientation: landscape) {
      #mainContent { flex-direction: row; }
      
      .alt-shutter-container { width: 100px; border-bottom: none; display: flex; align-items: center; justify-content: center; }
      #mainContent.edit-mode .alt-shutter-container { border-right: 1px solid var(--border); background: var(--surface); }

      #cameraArea { padding: max(8px, env(safe-area-inset-top)) 16px max(8px, env(safe-area-inset-bottom)) 16px; }
      
      #toolsPanel { width: 280px; justify-content: flex-start; }
      #mainContent.edit-mode #toolsPanel { border-radius: 24px 0 0 24px; border-left: 1px solid var(--border); }
      
      .tools-grid { grid-template-columns: repeat(2, 1fr); }
      .shutter-wrapper { margin-top: auto; margin-bottom: 8px; }
    }

    /* =====================================
       📁 Modals & Status Tags
       ===================================== */
    .modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal.show { opacity: 1; pointer-events: auto; }
    .m-card { flex: 1; margin: env(safe-area-inset-top) 0 0 0; background: var(--bg-light); color: var(--text-main); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .modal.show .m-card { transform: translateY(0); }
    
    .m-header { height: 56px; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 800; font-size: 1rem; flex-shrink:0; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-light); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); }
    
    .m-body { flex: 1; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
    .m-bottom { padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink:0; }
    
    .g-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border-radius: var(--radius-md); margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .g-thumb { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
    .g-info { flex: 1; cursor: pointer; }
    
    /* 🏷 ステータスバッジ */
    .status-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .status-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
    .badge-saved { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .badge-shared { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-none { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

    .input-box { width: 100%; height: 48px; border: 2px solid var(--border); border-radius: 10px; padding: 0 16px; font-size: 1rem; font-weight: 700; outline: none; background: var(--surface); color: var(--text-main); }
    .action-btn { height: 48px; background: var(--text-main); color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; }
    
    #flashEffect { position: fixed; inset: 0; background: #fff; z-index: 9000; opacity: 0; pointer-events: none; transition: opacity 0.1s; }
    #toast { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9999; background: rgba(255,255,255,0.95); color: var(--text-main); padding: 12px 24px; border-radius: 30px; font-weight: 800; display: none; white-space: nowrap; box-shadow: var(--shadow-md); text-align: center; }
  </style>
</head>
<body>

<div id="flashEffect"></div>
<div id="toast"></div>

<div id="app">
  <!-- 🪟 Header -->
  <header class="header" id="mainHeader">
    <div class="header-actions" id="mainActions">
      <div style="display:flex; gap:6px;">
        <button class="header-btn" onclick="showFullScreenHelp()">⛶ 全画面</button>
        <label class="header-btn" style="padding:0 12px;">
          📥 読込
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
        </label>
      </div>
      <button class="header-btn primary" id="btnGallery">一覧(<span id="gCount">0</span>)</button>
    </div>

    <div class="header-actions" id="editActions" style="display:none; justify-content:flex-end;">
      <button class="header-btn" id="btnEditorClose" style="background:var(--bg-light); color:var(--text-main); border:1px solid var(--border);">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> 戻る
      </button>
    </div>
  </header>

  <!-- 📷 Main Content Area -->
  <div id="mainContent">
    
    <!-- 🎛 反対側シャッター (縦なら上、横なら左) -->
    <div class="alt-shutter-container">
      <button class="shutter-circle-btn btn-action-sync" onclick="captureOrSave()">
        <svg class="shutter-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      </button>
    </div>

    <div id="cameraArea">
      <!-- 🔲 Viewfinder Container -->
      <main id="cameraWrapper" onclick="event.stopPropagation()">
        <video id="video" autoplay playsinline muted></video>
        <img id="editorImg" src="">
        
        <div id="stampPreview" class="overlay-ui"></div>
        
        <!-- Shape Previews -->
        <div id="shapePreview">
          <svg id="svgArrow" width="100" height="100" viewBox="-50 -50 100 100" style="display:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">
            <path d="M-40,0 L15,0 M15,-15 L40,0 L15,15 Z" fill="#E11D48" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
            <path d="M-40,0 L15,0 M15,-15 L40,0 L15,15 Z" fill="#E11D48" stroke="#E11D48" stroke-width="3" stroke-linejoin="round" />
          </svg>
          <svg id="svgCircle" width="120" height="120" viewBox="-60 -60 120 120" style="display:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">
            <circle cx="0" cy="0" r="45" fill="none" stroke="#fff" stroke-width="12" />
            <circle cx="0" cy="0" r="45" fill="none" stroke="#E11D48" stroke-width="6" />
          </svg>
        </div>
      </main>
    </div>

    <!-- 🎛 Tools Panel -->
    <section id="toolsPanel">
      <div class="tools-grid">
        <button class="tool-btn" data-stamp="作業前">作業前</button>
        <button class="tool-btn" data-stamp="作業中">作業中</button>
        <button class="tool-btn" data-stamp="作業後">作業後</button>
        <button class="tool-btn" id="btnCustomStamp">その他</button>
      </div>
      <div class="tools-grid">
        <button class="tool-btn" data-shape="arrow">➜ 矢印</button>
        <button class="tool-btn" data-shape="circle">〇 円</button>
        <button class="tool-btn" id="btnPosCycle" style="grid-column: span 2;" onclick="cycleStampPosition()">📍 位置: 左上</button>
      </div>
      <!-- メインシャッター -->
      <div class="shutter-wrapper">
        <button class="shutter-circle-btn btn-action-sync" onclick="captureOrSave()">
          <svg class="shutter-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
      </div>
    </section>
  </div>
</div>

<!-- 📁 Gallery Modal -->
<section id="modalGallery" class="modal">
  <div class="m-card">
    <div class="m-header">
      <div>写真一覧（タップして編集）</div>
      <button class="icon-btn" id="closeGallery"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
    </div>
    <div style="padding:10px 16px; background:var(--bg-light); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <div style="font-size:0.9rem; font-weight:800;">選択中: <span id="selCount" style="color:var(--primary);">0</span> 枚</div>
      <button class="tool-btn" id="btnDelete" style="height:36px; padding:0 12px; color:var(--primary); border-color:var(--primary); background:transparent;">
        🗑 削除
      </button>
    </div>
    <div class="m-body" id="galleryList"></div>
    <div class="m-bottom">
      <div style="display:flex; gap:6px;">
        <button class="tool-btn" id="btnSelectAll" style="flex:1; background:transparent;">全選択</button>
        <button class="tool-btn" id="btnSaveToDevice" style="flex:1; background:transparent;">📥 保存</button>
        <button class="action-btn" id="btnOpenSend" style="flex:1.5; margin-top:0; background:var(--primary);">✉ 送信</button>
      </div>
    </div>
  </div>
</section>

<!-- ✉ Send/Share Settings Modal -->
<section id="modalSend" class="modal">
  <div class="m-card">
    <div class="m-header">
      <div>共有・送信</div>
      <button class="icon-btn" id="closeSend"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    </div>
    <div class="m-body" style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label style="font-size:0.85rem; font-weight:800; color:var(--text-sub); display:block; margin-bottom:6px;">受付番号・件名</label>
        <input id="sendJobNum" class="input-box" type="text" placeholder="例: 現場名など">
      </div>
      <div>
        <label style="font-size:0.85rem; font-weight:800; color:var(--text-sub); display:block; margin-bottom:6px;">デフォルト宛先(To)</label>
        <input id="sendEmail" class="input-box" type="email" placeholder="example@mail.com">
      </div>
      <div style="font-size:0.8rem; color:var(--text-sub); line-height:1.5; background:var(--surface); padding:12px; border-radius:12px; border:1px solid var(--border);">
        💡 送信ボタンを押すと宛先アドレスがコピーされ、位置情報のMapリンクが本文に挿入されます。メーラーで宛先欄に「ペースト」してください。
      </div>
    </div>
    <div class="m-bottom">
      <button class="action-btn" id="btnExecSend" style="background:var(--primary);">🚀 共有メニューを開く</button>
    </div>
  </div>
</section>

<!-- ✏️ Custom Stamp Modal -->
<section id="modalStamp" class="modal">
  <div class="m-card" style="margin-top:auto;">
    <div class="m-header">
      <div>スタンプ作成</div>
      <button class="icon-btn" id="closeStamp"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></button>
    </div>
    <div class="m-body">
      <div style="display:flex; gap:8px; margin-bottom:20px;">
        <input id="newStampText" class="input-box" type="text" placeholder="新しいテキスト">
        <button class="action-btn" id="btnAddStamp" style="width:80px; height:48px; margin-top:0; background:var(--primary);">追加</button>
      </div>
      <div id="customStampList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>
</section>

<script>
let db, photos = [];
let stream, cameraStarted = false;
let editMode = false, editTargetId = null;

let currentStamp = null;
const positions = ["top-left", "top-right", "bottom-left", "bottom-right"];
const positionLabels = { "top-left": "左上", "top-right": "右上", "bottom-left": "左下", "bottom-right": "右下" };
let stampPosIndex = 0;

let activeShape = null; 
let shapePos = null;
let shapeScale = 1.0;
let shapeAngle = 0; 

let deviceCoords = null;

const cvs = document.createElement("canvas");
const ctx = cvs.getContext("2d");
const video = document.getElementById("video");
const editorImg = document.getElementById("editorImg");
const cameraWrapper = document.getElementById("cameraWrapper");
const shapePreview = document.getElementById("shapePreview");

window.onload = async () => {
  await initDB();
  startGps();
  await startCamera();
  loadSettings();
  setupEvents();
  updateUI();
};

function initDB() {
  return new Promise(res => {
    const req = indexedDB.open("FieldCameraProDB_v5", 1);
    req.onupgradeneeded = e => { if(!e.target.result.objectStoreNames.contains("photos")) e.target.result.createObjectStore("photos", {keyPath:"id"}); };
    req.onsuccess = e => {
      db = e.target.result;
      db.transaction("photos").objectStore("photos").getAll().onsuccess = ev => {
        photos = ev.target.result.sort((a,b)=>b.id-a.id);
        document.getElementById("gCount").textContent = photos.length;
        res();
      };
    };
  });
}

function startGps() {
  if(navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      deviceCoords = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    }, () => {}, {enableHighAccuracy: true});
  }
}

async function startCamera() {
  try {
    if(stream) { stream.getTracks().forEach(track => track.stop()); }
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = stream;
    await video.play();
    cameraStarted = true;
    
    if(!editMode && video.videoWidth && video.videoHeight) {
      cameraWrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
    }
  } catch(e) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
      await video.play();
      cameraStarted = true;
    } catch(err) {
      toast("カメラの起動に失敗しました。");
    }
  }
}

function setupEvents() {
  document.querySelectorAll("[data-stamp]").forEach(b => b.onclick = () => {
    currentStamp = currentStamp === b.dataset.stamp ? null : b.dataset.stamp; 
    updateUI();
  });
  
  document.querySelectorAll("[data-shape]").forEach(b => b.onclick = () => {
    activeShape = activeShape === b.dataset.shape ? null : b.dataset.shape;
    if(activeShape && !shapePos) toast("画面をタップして配置してください");
    if(!activeShape) shapePos = null;
    updateUI();
  });

  setupGestures();

  document.getElementById("fileInput").onchange = handleImport;
  document.getElementById("btnGallery").onclick = () => { renderGallery(); openM('modalGallery'); };
  document.getElementById("closeGallery").onclick = () => closeM('modalGallery');
  document.getElementById("btnEditorClose").onclick = closeEditor;

  document.getElementById("btnSelectAll").onclick = () => {
    const chk = photos.some(p => !p.selected);
    photos.forEach(p => p.selected = chk); 
    renderGallery();
  };
  
  document.getElementById("btnDelete").onclick = () => {
    const sel = photos.filter(p => p.selected);
    if(sel.length && confirm(`${sel.length}枚削除しますか？`)) {
      sel.forEach(p => db.transaction("photos","readwrite").objectStore("photos").delete(p.id));
      photos = photos.filter(p => !p.selected); 
      renderGallery();
      updateUI();
    }
  };
  
  // 保存ボタン
  document.getElementById("btnSaveToDevice").onclick = async () => {
    const sel = photos.filter(p => p.selected);
    if(!sel.length) return toast("写真を選択してください");
    
    sel.forEach(p => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(p.blob);
      a.download = `現場写真_${Date.now()}.jpg`;
      a.click();
      
      p.saved = true;
      db.transaction("photos","readwrite").objectStore("photos").put(p);
    });
    renderGallery();
    toast("端末に保存しました");
  };
  
  document.getElementById("btnOpenSend").onclick = () => {
    if(!photos.some(p => p.selected)) return toast("写真を選択してください");
    openM('modalSend');
  };
  document.getElementById("closeSend").onclick = () => closeM('modalSend');
  document.getElementById("btnExecSend").onclick = executeShare;

  document.getElementById("btnCustomStamp").onclick = () => { renderCustomStamps(); openM('modalStamp'); };
  document.getElementById("closeStamp").onclick = () => closeM('modalStamp');
  document.getElementById("btnAddStamp").onclick = addCustomStamp;

  window.addEventListener('resize', () => {
    if(!editMode && video.videoWidth && video.videoHeight) {
      cameraWrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
    }
  });
}

function cycleStampPosition() {
  stampPosIndex = (stampPosIndex + 1) % positions.length;
  updateUI();
}

function updateUI() {
  document.querySelectorAll("[data-stamp]").forEach(b => b.classList.toggle("active", b.dataset.stamp === currentStamp));
  document.querySelectorAll("[data-shape]").forEach(b => b.classList.toggle("active", b.dataset.shape === activeShape));
  
  const currentPosKey = positions[stampPosIndex];
  const posBtn = document.getElementById("btnPosCycle");
  if(posBtn) {
    posBtn.textContent = `📍 位置: ${positionLabels[currentPosKey]}`;
    posBtn.classList.add("active");
  }
  
  const sp = document.getElementById("stampPreview");
  if(currentStamp) {
    sp.style.display = "block"; 
    sp.textContent = currentStamp;
    sp.style.top = "auto"; sp.style.bottom = "auto"; sp.style.left = "auto"; sp.style.right = "auto";
    
    if(currentPosKey === "top-left") { sp.style.top="12px"; sp.style.left="12px"; }
    else if(currentPosKey === "top-right") { sp.style.top="12px"; sp.style.right="12px"; }
    else if(currentPosKey === "bottom-left") { sp.style.bottom="12px"; sp.style.left="12px"; }
    else if(currentPosKey === "bottom-right") { sp.style.bottom="12px"; sp.style.right="12px"; }
  } else {
    sp.style.display = "none";
  }

  if(activeShape && shapePos) {
    shapePreview.style.display = "block";
    shapePreview.style.left = shapePos.x + "px"; 
    shapePreview.style.top = shapePos.y + "px";
    shapePreview.style.transform = `translate(-50%, -50%) rotate(${shapeAngle}rad) scale(${shapeScale})`;
    document.getElementById("svgArrow").style.display = activeShape === 'arrow' ? "block" : "none";
    document.getElementById("svgCircle").style.display = activeShape === 'circle' ? "block" : "none";
  } else {
    shapePreview.style.display = "none";
  }
  document.getElementById("gCount").textContent = photos.length;
}

function syncActionButtons(isEdit) {
  document.querySelectorAll(".shutter-circle-btn").forEach(btn => {
    if(isEdit) btn.classList.add("edit-save");
    else btn.classList.remove("edit-save");
  });
}

function showFullScreenHelp() {
  toast("Safari下部の [共有ボタン] から<br>『ホーム画面に追加』を押すと<br>URLバーが消えて全画面アプリになります");
}

function setupGestures() {
  let ptrs = []; let initP = null;
  cameraWrapper.addEventListener('pointerdown', e => {
    if(!activeShape) return;
    e.preventDefault(); 
    ptrs.push(e);
    if(ptrs.length === 1) {
      const r = cameraWrapper.getBoundingClientRect();
      const pt = { x: e.clientX - r.left, y: e.clientY - r.top };
      if(!shapePos || Math.hypot(pt.x - shapePos.x, pt.y - shapePos.y) > 100) {
        shapePos = pt;
      }
    } else if (ptrs.length === 2) {
      initP = {
        d: Math.hypot(ptrs[0].clientX - ptrs[1].clientX, ptrs[0].clientY - ptrs[1].clientY),
        a: Math.atan2(ptrs[1].clientY - ptrs[0].clientY, ptrs[1].clientX - ptrs[0].clientX),
        s: shapeScale, ang: shapeAngle
      };
    }
    updateUI();
  });
  
  cameraWrapper.addEventListener('pointermove', e => {
    if(!activeShape || ptrs.length === 0) return;
    e.preventDefault();
    const idx = ptrs.findIndex(p => p.pointerId === e.pointerId); 
    if(idx >= 0) ptrs[idx] = e;
    
    if(ptrs.length === 1) { 
      const r = cameraWrapper.getBoundingClientRect();
      shapePos = { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) }; 
    } else if (ptrs.length === 2 && initP) {
      const d = Math.hypot(ptrs[0].clientX - ptrs[1].clientX, ptrs[0].clientY - ptrs[1].clientY);
      const a = Math.atan2(ptrs[1].clientY - ptrs[0].clientY, ptrs[1].clientX - ptrs[0].clientX);
      shapeScale = Math.max(0.4, Math.min(initP.s * (d / initP.d), 4.0));
      shapeAngle = initP.ang + (a - initP.a);
    }
    updateUI();
  });
  
  const up = e => { 
    ptrs = ptrs.filter(p => p.pointerId !== e.pointerId); 
    if(ptrs.length < 2) initP = null; 
  };
  cameraWrapper.addEventListener('pointerup', up); 
  cameraWrapper.addEventListener('pointercancel', up);
}

async function handleImport(e) {
  const files = Array.from(e.target.files); 
  if(!files.length) return;
  toast(`画像を読み込んでいます...`);
  
  for(let i=0; i<files.length; i++) {
    const file = files[i];
    const bmp = await createImageBitmap(file);
    let w = bmp.width, h = bmp.height, max = 1600;
    if(w > h && w > max) { h = Math.round(h * max / w); w = max; } 
    else if(h > max) { w = Math.round(w * max / h); h = max; }
    
    cvs.width = w; cvs.height = h; 
    ctx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => cvs.toBlob(r, "image/jpeg", 0.9));
    const item = { id: Date.now() + i, blob, stamp: "未編集", created: new Date().toISOString(), selected: false, coords: deviceCoords, saved: false, shared: false };
    photos.unshift(item); 
    await db.transaction("photos","readwrite").objectStore("photos").put(item);
  }
  e.target.value = ""; 
  updateUI();
  renderGallery(); 
  openM('modalGallery');
}

function openEditor(id) {
  const p = photos.find(x => x.id === id); 
  if(!p) return;
  editMode = true; 
  editTargetId = id;
  editorImg.src = URL.createObjectURL(p.blob);
  
  editorImg.onload = () => { 
    cameraWrapper.style.aspectRatio = `${editorImg.naturalWidth} / ${editorImg.naturalHeight}`; 
  };
  
  video.style.display = "none"; 
  editorImg.style.display = "block";
  document.getElementById("mainActions").style.display = "none";
  document.getElementById("editActions").style.display = "flex";
  document.getElementById("mainContent").classList.add("edit-mode");
  document.getElementById("mainHeader").classList.add("edit-mode");
  
  syncActionButtons(true);
  
  closeM('modalGallery');
  currentStamp = null; activeShape = null; shapePos = null; updateUI();
}

function closeEditor() {
  editMode = false; 
  editTargetId = null;
  video.style.display = "block"; 
  editorImg.style.display = "none";
  if(video.videoWidth && video.videoHeight) {
    cameraWrapper.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  }
  
  document.getElementById("mainActions").style.display = "flex";
  document.getElementById("editActions").style.display = "none";
  document.getElementById("mainContent").classList.remove("edit-mode");
  document.getElementById("mainHeader").classList.remove("edit-mode");
  
  syncActionButtons(false);
  
  currentStamp = null; activeShape = null; shapePos = null; updateUI();
}

function captureOrSave() {
  if (editMode) saveEdit(); else capturePhoto();
}

async function capturePhoto() {
  if(!video.videoWidth) return toast("カメラ準備中です");
  
  const flash = document.getElementById("flashEffect");
  flash.style.opacity = "1"; 
  setTimeout(() => flash.style.opacity = "0", 120);

  let w = video.videoWidth, h = video.videoHeight, max = 1600;
  if(w > h && w > max) { h = Math.round(h * max / w); w = max; } 
  else if(h > max) { w = Math.round(w * max / h); h = max; }
  
  cvs.width = w; cvs.height = h; 
  const sc = w / video.videoWidth;
  ctx.drawImage(video, 0, 0, w, h);
  
  if(currentStamp) drawStamp(ctx, currentStamp, w, h);
  if(activeShape && shapePos) {
    const r = cameraWrapper.getBoundingClientRect();
    const pt = { x: shapePos.x * (video.videoWidth / r.width), y: shapePos.y * (video.videoHeight / r.height) };
    drawShape(ctx, pt.x * sc, pt.y * sc, w, h);
  }
  
  const blob = await new Promise(r => cvs.toBlob(r, "image/jpeg", 0.9));
  const stampName = currentStamp || (activeShape ? "図形追加" : "現場写真");
  const item = { id: Date.now(), blob, stamp: stampName, created: new Date().toISOString(), selected: true, coords: deviceCoords, saved: false, shared: false };
  photos.unshift(item); 
  await db.transaction("photos","readwrite").objectStore("photos").put(item);
  
  updateUI(); 
  toast(`撮影しました（計${photos.length}枚）`);
}

async function saveEdit() {
  const srcW = editorImg.naturalWidth, srcH = editorImg.naturalHeight;
  cvs.width = srcW; cvs.height = srcH;
  ctx.drawImage(editorImg, 0, 0, srcW, srcH);

  if(currentStamp) drawStamp(ctx, currentStamp, srcW, srcH);
  if(activeShape && shapePos) {
    const r = cameraWrapper.getBoundingClientRect();
    const pt = { x: shapePos.x * (srcW / r.width), y: shapePos.y * (srcH / r.height) };
    drawShape(ctx, pt.x, pt.y, srcW, srcH);
  }

  const blob = await new Promise(r => cvs.toBlob(r, "image/jpeg", 0.9));
  const stampName = currentStamp || (activeShape ? "図形追加" : "編集済");
  
  const item = photos.find(x => x.id === editTargetId);
  item.blob = blob; 
  item.stamp = stampName;
  await db.transaction("photos","readwrite").objectStore("photos").put(item);
  
  toast("上書き保存しました"); 
  closeEditor(); 
  renderGallery(); 
  openM('modalGallery');
}

function drawStamp(ctx, txt, w, h) {
  const fz = Math.max(38, Math.round(w * 0.038)), pad = fz * 0.4, m = Math.round(w * 0.025);
  ctx.font = `bold ${fz}px sans-serif`;
  const boxW = ctx.measureText(txt).width + pad * 2, boxH = fz + pad * 2;
  let x = m, y = m;
  
  const currentPosKey = positions[stampPosIndex];
  if(currentPosKey === "top-right") { x = w - boxW - m; y = m; }
  else if(currentPosKey === "bottom-left") { x = m; y = h - boxH - m; }
  else if(currentPosKey === "bottom-right") { x = w - boxW - m; y = h - boxH - m; }
  
  ctx.fillStyle = "rgba(0,0,0,0.85)"; 
  ctx.lineJoin = "round"; 
  ctx.lineWidth = 12; 
  ctx.strokeStyle = "rgba(0,0,0,0.85)";
  ctx.strokeRect(x+6, y+6, boxW-12, boxH-12); 
  ctx.fillRect(x+6, y+6, boxW-12, boxH-12);
  ctx.strokeStyle = "#fff"; 
  ctx.lineWidth = Math.max(3, w * 0.003); 
  ctx.strokeRect(x, y, boxW, boxH);
  ctx.fillStyle = "#fff"; 
  ctx.textBaseline = "middle"; 
  ctx.fillText(txt, x + pad, y + boxH / 2);
}

function drawShape(ctx, tx, ty, w, h) {
  ctx.save(); 
  ctx.translate(tx, ty); 
  ctx.rotate(shapeAngle);
  const baseScale = (Math.min(w, h) / 1000) * shapeScale;
  ctx.scale(baseScale, baseScale); 
  ctx.lineCap = "round"; 
  ctx.lineJoin = "round";
  
  if(activeShape === 'arrow') {
    ctx.strokeStyle="#fff"; ctx.lineWidth=24;
    ctx.beginPath(); ctx.moveTo(-60,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(0,-30); ctx.lineTo(0,30); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle="#E11D48"; ctx.fillStyle="#E11D48"; ctx.lineWidth=14;
    ctx.beginPath(); ctx.moveTo(-60,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(0,-30); ctx.lineTo(0,30); ctx.closePath(); ctx.fill();
  } else {
    ctx.strokeStyle="#fff"; ctx.lineWidth=24; ctx.beginPath(); ctx.arc(0,0,70,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle="#E11D48"; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(0,0,70,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function renderGallery() {
  const list = document.getElementById("galleryList"); 
  list.innerHTML = "";
  document.getElementById("selCount").textContent = photos.filter(p => p.selected).length;
  if(!photos.length) { 
    list.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--text-sub); font-weight:700;">保存された写真がありません</div>`; 
    return; 
  }
  
  photos.forEach(p => {
    const row = document.createElement("div"); row.className = "g-row";
    
    const chk = document.createElement("input"); 
    chk.type = "checkbox"; chk.checked = p.selected; 
    chk.style.width="24px"; chk.style.height="24px"; chk.style.accentColor="var(--primary)";
    chk.onchange = () => { p.selected = chk.checked; document.getElementById("selCount").textContent = photos.filter(x=>x.selected).length; };
    
    const img = document.createElement("img"); 
    img.className = "g-thumb"; img.src = URL.createObjectURL(p.blob);
    img.onclick = () => openEditor(p.id);
    
    const info = document.createElement("div"); 
    info.className = "g-info";
    const d = new Date(p.created);
    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
    
    let statusHtml = '<div class="status-tags">';
    if (p.shared) statusHtml += '<span class="status-badge badge-shared">✅ 送信済</span>';
    if (p.saved) statusHtml += '<span class="status-badge badge-saved">⬇️ 保存済</span>';
    if (!p.shared && !p.saved) statusHtml += '<span class="status-badge badge-none">⬜︎ 未保存</span>';
    statusHtml += '</div>';

    info.innerHTML = `<strong style="font-size:1rem; color:var(--text-main);">${p.stamp}</strong><br><small style="color:var(--text-sub);">${timeStr}</small>${statusHtml}`;
    info.onclick = () => openEditor(p.id);
    
    row.append(chk, img, info); 
    list.appendChild(row);
  });
}

async function executeShare() {
  const sel = photos.filter(p => p.selected); 
  if(!sel.length) return toast("写真が選択されていません");
  const email = document.getElementById("sendEmail").value.trim();
  const num = document.getElementById("sendJobNum").value.trim() || "現場報告";
  localStorage.setItem("defEmail", email);
  
  if(email) { try { await navigator.clipboard.writeText(email); toast("宛先をコピーしました！"); } catch(e) {} }

  let text = `【案件名・受付番号】\n${num}\n\n`;
  sel.forEach((p, idx) => {
    const d = new Date(p.created);
    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
    text += `■ 写真 ${idx + 1} (${p.stamp} - ${timeStr})\n`;
    if(p.coords) text += `Googleマップ: https://maps.google.com/?q=${p.coords.lat},${p.coords.lng}\n\n`;
    else text += `Googleマップ: 位置情報なし\n\n`;
  });
  
  const files = await Promise.all(sel.map(async (p,i) => new File([await p.blob.arrayBuffer()], `写真_${i+1}.jpg`, {type:"image/jpeg"})));
  if(navigator.canShare && navigator.canShare({files})) {
    setTimeout(async () => {
      try { 
        await navigator.share({text, files}); 
        sel.forEach(p => {
          p.shared = true;
          db.transaction("photos","readwrite").objectStore("photos").put(p);
        });
        renderGallery();
      } catch(e){}
    }, email ? 800 : 0);
  } else {
    toast("共有機能がサポートされていません");
  }
}

let customStamps = [];
function loadSettings() {
  customStamps = JSON.parse(localStorage.getItem("customStamps")) || [];
  document.getElementById("sendEmail").value = localStorage.getItem("defEmail") || "";
}

function renderCustomStamps() {
  const list = document.getElementById("customStampList"); 
  list.innerHTML = "";
  if(!customStamps.length) list.innerHTML = "<div style='color:var(--text-sub); font-size:0.85rem; font-weight:700;'>カスタムスタンプはありません</div>";
  customStamps.forEach((t, i) => {
    const row = document.createElement("div"); row.style.display="flex"; row.style.gap="8px";
    const btn = document.createElement("button"); btn.className = "tool-btn"; btn.style.flex="1"; btn.textContent = t;
    btn.onclick = () => { currentStamp = t; updateUI(); closeM('modalStamp'); };
    const del = document.createElement("button"); del.className = "icon-btn"; del.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="color:var(--primary);"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
    del.onclick = () => { customStamps.splice(i, 1); localStorage.setItem("customStamps", JSON.stringify(customStamps)); renderCustomStamps(); };
    row.append(btn, del); 
    list.appendChild(row);
  });
}

function addCustomStamp() {
  const v = document.getElementById("newStampText").value.trim(); 
  if(!v) return;
  customStamps.push(v); 
  localStorage.setItem("customStamps", JSON.stringify(customStamps));
  document.getElementById("newStampText").value = ""; 
  renderCustomStamps();
}

function openM(id) { document.getElementById(id).classList.add("show"); }
function closeM(id) { document.getElementById(id).classList.remove("show"); }
let tTmr; function toast(msg) { const t=document.getElementById("toast"); t.innerHTML=msg; t.style.display="block"; clearTimeout(tTmr); tTmr=setTimeout(()=>t.style.display="none",3000); }
</script>
