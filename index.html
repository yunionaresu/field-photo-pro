<style>

<script>
"use strict";

const $ = id => document.getElementById(id);
const positions = ["top-left","top-right","bottom-left","bottom-right"];
const positionLabels = {"top-left":"左上","top-right":"右上","bottom-left":"左下","bottom-right":"右下"};

let db, photos=[];
let stream=null, gpsWatchId=null, deviceCoords=null;
let editMode=false, editTargetId=null;
let currentStamp=null, stampPosIndex=0;
let activeShape=null, shapePos=null, shapeScale=1, shapeAngle=0;
let interactionMode=null, initAngle=0, initialShapeAngle=0, initDist=0, initScale=1;
let sendSelectedType="修理写真", customStamps=[];
let toastTimer=null, editorObjectURL=null, galleryURLs=[];
let saving=false;

const cvs=document.createElement("canvas");
const ctx=cvs.getContext("2d",{alpha:false});
const video=$("video"), editorImg=$("editorImg"), cameraWrapper=$("cameraWrapper");
const shapePreview=$("shapePreview");

function requestFrame(){return new Promise(resolve=>requestAnimationFrame(resolve));}

function dbRequest(store,method,value){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction("photos","readwrite");
  const req=value===undefined?tx.objectStore("photos")[method]():tx.objectStore("photos")[method](value);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}

function dbPut(item){return dbRequest("photos","put",item);}
function dbDelete(id){return dbRequest("photos","delete",id);}

function initDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open("FieldCameraProDB_v11",1);
  req.onupgradeneeded=e=>{
   if(!e.target.result.objectStoreNames.contains("photos"))
    e.target.result.createObjectStore("photos",{keyPath:"id"});
  };
  req.onsuccess=async e=>{
   db=e.target.result;
   db.onversionchange=()=>db.close();
   try{
    photos=(await new Promise((r,j)=>{
     const q=db.transaction("photos").objectStore("photos").getAll();
     q.onsuccess=()=>r(q.result);
     q.onerror=()=>j(q.error);
    })).sort((a,b)=>b.id-a.id);
    resolve();
   }catch(err){reject(err);}
  };
  req.onerror=()=>reject(req.error);
 });
}

window.addEventListener("load",async()=>{
 if(localStorage.getItem("authorized_pin")===APP_PIN_CODE){
  $("pinOverlay").style.display="none";
  await initApp();
 }else $("app").style.filter="blur(10px)";
});

$("btnPinSubmit").onclick=async()=>{
 if($("pinInput").value.trim()===APP_PIN_CODE){
  localStorage.setItem("authorized_pin",APP_PIN_CODE);
  $("pinOverlay").style.display="none";
  $("app").style.filter="none";
  await initApp();
 }else $("pinError").style.display="block";
};

$("pinInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnPinSubmit").click();});

async function initApp(){
 try{
  await initDB();
  loadSettings();
  setupEvents();
  updateUI();
  await requestPermissions();
 }catch(e){toast("初期化に失敗しました");console.error(e);}
}

async function requestPermissions(){
 const overlay=$("permissionOverlay"),msg=$("permissionMsg");
 overlay.style.display="flex";
 msg.textContent="カメラと位置情報の許可を確認しています...";
 let camOk=false,gpsOk=false,errors=[];

 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("このブラウザではカメラを使用できません。HTTPSで開いてください。");
  try{
   stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}
   });
  }catch(e){
   stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
  }
  camOk=true;
 }catch(e){errors.push("カメラ: "+e.message);}

 try{
  if(!navigator.geolocation)throw new Error("位置情報に対応していません");
  const pos=await new Promise((resolve,reject)=>{
   navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:12000,maximumAge:10000});
  });
  deviceCoords={lat:pos.coords.latitude,lng:pos.coords.longitude};
  gpsOk=true;
  if(gpsWatchId!==null)navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId=navigator.geolocation.watchPosition(p=>{
   deviceCoords={lat:p.coords.latitude,lng:p.coords.longitude};
  },()=>{},{enableHighAccuracy:true,maximumAge:10000});
 }catch(e){errors.push("位置情報: "+(e.message||"取得できません"));}

 if(camOk){
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  cameraStarted=true;
  setCameraAspect();
 }
 if(camOk&&gpsOk){
  overlay.style.display="none";
  const hint=$("startupHint");
  hint.style.opacity="1";
  setTimeout(()=>hint.style.opacity="0",2500);
 }else{

function setupGestures(){
 const pointers=new Map();

 cameraWrapper.addEventListener("pointerdown",e=>{
  if(!activeShape)return;
  e.preventDefault();
  cameraWrapper.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=cameraWrapper.getBoundingClientRect();
  const pt={x:e.clientX-r.left,y:e.clientY-r.top};

  if(pointers.size===1){
   if(!shapePos){shapePos=pt;interactionMode="move";}
   else{
    const d=Math.hypot(pt.x-shapePos.x,pt.y-shapePos.y);
    if(d<Math.max(45,55*shapeScale))interactionMode="move";
    else if(activeShape==="arrow"){
     interactionMode="rotate";
     initAngle=Math.atan2(pt.y-shapePos.y,pt.x-shapePos.x);
     initialShapeAngle=shapeAngle;
    }else{
     interactionMode="scale";
     initDist=Math.max(1,d);initScale=shapeScale;
    }
   }
  }else if(pointers.size===2&&activeShape==="arrow"){
   interactionMode="pinch";
   const a=[...pointers.values()];
   initDist=Math.max(1,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y));
   initScale=shapeScale;
  }
  updateUI();
 });

 cameraWrapper.addEventListener("pointermove",e=>{
  if(!activeShape||!pointers.has(e.pointerId))return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=cameraWrapper.getBoundingClientRect();
  const a=[...pointers.values()];

  if(a.length===1){
   const pt={x:a[0].x-r.left,y:a[0].y-r.top};
   if(interactionMode==="move"){
    shapePos={x:Math.max(0,Math.min(r.width,pt.x)),y:Math.max(0,Math.min(r.height,pt.y))};
   }else if(interactionMode==="rotate"){
    shapeAngle=initialShapeAngle+Math.atan2(pt.y-shapePos.y,pt.x-shapePos.x)-initAngle;
   }else if(interactionMode==="scale"){
    const d=Math.hypot(pt.x-shapePos.x,pt.y-shapePos.y);
    shapeScale=Math.max(.2,Math.min(5,initScale*d/initDist));
   }
  }else if(a.length===2&&interactionMode==="pinch"){
   const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
   shapeScale=Math.max(.4,Math.min(5,initScale*d/initDist));
  }
  updateUI();
 });

 const up=e=>{
  pointers.delete(e.pointerId);
  if(!pointers.size)interactionMode=null;
 };
 ["pointerup","pointercancel","lostpointercapture"].forEach(type=>cameraWrapper.addEventListener(type,up));
}

/* EXIF */

function degToDmsRational(v){
 const d=Math.floor(v),mFloat=(v-d)*60,m=Math.floor(mFloat);
 return [[d,1],[m,1],[Math.round((mFloat-m)*60*100),100]];
}

function getExifData(dataUrl){
 let coords=null,createdDate=null;
 try{
  if(typeof piexif==="undefined")return {coords,createdDate};
  const ex=piexif.load(dataUrl),g=ex.GPS||{};
  const lat=g[piexif.GPSIFD.GPSLatitude],lng=g[piexif.GPSIFD.GPSLongitude];
  if(lat&&lng){
   const val=a=>a[0][0]/a[0][1]+a[1][0]/a[1][1]/60+a[2][0]/a[2][1]/3600;
   coords={lat:val(lat)*(g[piexif.GPSIFD.GPSLatitudeRef]==="S"?-1:1),lng:val(lng)*(g[piexif.GPSIFD.GPSLongitudeRef]==="W"?-1:1)};
  }
  const dt=(ex.Exif||{})[piexif.ExifIFD.DateTimeOriginal]||(ex["0th"]||{})[piexif.ImageIFD.DateTime];
  if(typeof dt==="string"){
   const a=dt.split(/[: ]/).map(Number);
   if(a.length===6)createdDate=new Date(a[0],a[1]-1,a[2],a[3],a[4],a[5]);
  }
 }catch(e){}
 return {coords,createdDate};
}

function canvasBlob(canvas,quality){
 return new Promise((resolve,reject)=>{
  canvas.toBlob(b=>b?resolve(b):reject(new Error("画像変換に失敗しました")),"image/jpeg",quality);
 });
}

async function generateExifBlob(canvas,quality,dateObj,coords){
 const raw=await canvasBlob(canvas,quality);
 if(typeof piexif==="undefined")return raw;
 try{
  const dataUrl=canvas.toDataURL("image/jpeg",quality);
  const pad=n=>String(n).padStart(2,"0");
  const dateStr=`${dateObj.getFullYear()}:${pad(dateObj.getMonth()+1)}:${pad(dateObj.getDate())} ${pad(dateObj.getHours())}:${pad(dateObj.getMinutes())}:${pad(dateObj.getSeconds())}`;
  const ex={"0th":{},"Exif":{},"GPS":{}};
  ex.Exif[piexif.ExifIFD.DateTimeOriginal]=dateStr;
  ex["0th"][piexif.ImageIFD.DateTime]=dateStr;
  if(coords){
   ex.GPS[piexif.GPSIFD.GPSLatitudeRef]=coords.lat<0?"S":"N";
   ex.GPS[piexif.GPSIFD.GPSLatitude]=degToDmsRational(Math.abs(coords.lat));
   ex.GPS[piexif.GPSIFD.GPSLongitudeRef]=coords.lng<0?"W":"E";
   ex.GPS[piexif.GPSIFD.GPSLongitude]=degToDmsRational(Math.abs(coords.lng));
  }
  const inserted=piexif.insert(piexif.dump(ex),dataUrl);
  const bin=atob(inserted.split(",")[1]);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:"image/jpeg"});
 }catch(e){return raw;}
}

/* Import */

async function handleImport(e){
 const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith("image/"));
 if(!files.length)return;
 toast("画像を読み込んでいます...");
 try{
  for(let i=0;i<files.length;i++){
   const file=files[i];
   let meta={coords:null,createdDate:null};
   if(typeof piexif!=="undefined"&&file.size<25*1024*1024){
    const dataUrl=await new Promise((resolve,reject)=>{
     const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
    });
    meta=getExifData(dataUrl);
   }
   const date=meta.createdDate||new Date();
   const coords=meta.coords||deviceCoords;
   const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
   const maxDim=4096;
   const scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
   cvs.width=Math.round(bmp.width*scale);cvs.height=Math.round(bmp.height*scale);
   ctx.drawImage(bmp,0,0,cvs.width,cvs.height);
   bmp.close?.();
   const blob=await generateExifBlob(cvs,.95,date,coords);
   const item={id:Date.now()+i,blob,stamp:"未編集",created:date.toISOString(),selected:false,coords,saved:false,shared:false};
   photos.unshift(item);
   await dbPut(item);
  }
  e.target.value="";
  updateUI();renderGallery();openM("modalGallery");
  toast(`${files.length}枚読み込みました`);
 }catch(err){console.error(err);toast("画像の読み込みに失敗しました");}
}

async function capturePhoto(){

  }
  const date=new Date(),blob=await generateExifBlob(cvs,.96,date,deviceCoords);
  const item={id:Date.now(),blob,stamp:currentStamp||(activeShape?"図形追加":"現場写真"),created:date.toISOString(),selected:true,coords:deviceCoords,saved:false,shared:false};
  photos.unshift(item);await dbPut(item);

async function saveEdit(){
 if(!editTargetId||!editorImg.complete)return;
 saving=true;
 try{
  const w=editorImg.naturalWidth,h=editorImg.naturalHeight;
  cvs.width=w;cvs.height=h;ctx.drawImage(editorImg,0,0,w,h);
  if(currentStamp)drawStamp(ctx,currentStamp,w,h);
  if(activeShape&&shapePos){
   const r=cameraWrapper.getBoundingClientRect();
   drawShape(ctx,shapePos.x*w/r.width,shapePos.y*h/r.height,w,h);
  }
  const p=photos.find(x=>x.id===editTargetId);if(!p)return;
  p.blob=await generateExifBlob(cvs,.95,new Date(),p.coords||deviceCoords);
  p.stamp=currentStamp||(activeShape?"図形追加":"編集済");
  await dbPut(p);
  toast("上書き保存しました");
  closeEditor();renderGallery();openM("modalGallery");
 }catch(e){console.error(e);toast("保存に失敗しました");}
 finally{saving=false;}
}

function drawStamp(ctx,txt,w,h){
 const fz=Math.max(38,Math.round(w*.038)),pad=fz*.4,m=Math.round(w*.025);
 ctx.font=`bold ${fz}px sans-serif`;
 const bw=ctx.measureText(txt).width+pad*2,bh=fz+pad*2;
 let x=m,y=m;
 const pos=positions[stampPosIndex];
 if(pos.includes("right"))x=w-bw-m;
 if(pos.includes("bottom"))y=h-bh-m;
 ctx.fillStyle="rgba(0,0,0,.85)";
 ctx.fillRect(x,y,bw,bh);
 ctx.strokeStyle="#fff";ctx.lineWidth=Math.max(3,w*.003);
 ctx.strokeRect(x,y,bw,bh);
 ctx.fillStyle="#fff";ctx.textBaseline="middle";
 ctx.fillText(txt,x+pad,y+bh/2);
}

function drawShape(ctx,x,y,w,h){
 ctx.save();ctx.translate(x,y);ctx.rotate(shapeAngle);
 const s=Math.min(w,h)/1000*shapeScale;ctx.scale(s,s);
 ctx.lineCap="round";ctx.lineJoin="round";
 if(activeShape==="arrow"){
  ctx.strokeStyle="#fff";ctx.lineWidth=24;
  ctx.beginPath();ctx.moveTo(-60,0);ctx.lineTo(30,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(0,-30);ctx.lineTo(0,30);ctx.closePath();ctx.stroke();
  ctx.strokeStyle="#E11D48";ctx.fillStyle="#E11D48";ctx.lineWidth=14;
  ctx.beginPath();ctx.moveTo(-60,0);ctx.lineTo(30,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(0,-30);ctx.lineTo(0,30);ctx.closePath();ctx.fill();
 }else{
  ctx.strokeStyle="#fff";ctx.lineWidth=24;ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle="#E11D48";ctx.lineWidth=14;ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.stroke();
 }
 ctx.restore();
}

/* Save */

async function saveSelectedToDevice(){
 const sel=photos.filter(p=>p.selected);
 if(!sel.length)return toast("写真を選択してください");
 if(!confirm(`${sel.length}枚の画像を端末に保存しますか？`))return;
 try{
  const files=await Promise.all(sel.map(async(p,i)=>new File([p.blob],`現場写真_${Date.now()}_${i+1}.jpg`,{type:"image/jpeg"})));
  if(navigator.canShare?.({files})){
   await navigator.share({files});
   for(const p of sel){p.saved=true;await dbPut(p);}
  }else{
   for(const [i,p] of sel.entries()){
    const url=URL.createObjectURL(p.blob);
    const a=document.createElement("a");a.href=url;a.download=`現場写真_${Date.now()}_${i+1}.jpg`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
   }
   toast("保存用ファイルを作成しました");
  }
  renderGallery();
 }catch(e){if(e.name!=="AbortError")toast("保存処理に失敗しました");}
}

/* Share */

async function compressForEmail(blob){
 const bmp=await createImageBitmap(blob);
 const maxDim=1440,scale=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
 const w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
 const c=document.createElement("canvas");c.width=w;c.height=h;
 c.getContext("2d",{alpha:false}).drawImage(bmp,0,0,w,h);
 bmp.close?.();
 return canvasBlob(c,.8);
}

async function executeShare(){
 const sel=photos.filter(p=>p.selected);
 if(!sel.length)return toast("写真が選択されていません");
 const btn=$("btnExecSend");btn.disabled=true;
 try{
  toast("写真を圧縮しています...");
  const email=$("sendEmail").value.trim();
  const num=$("sendJobNum").value.trim()||"未入力";
  localStorage.setItem("defEmail",email);
  if(email){
   try{await navigator.clipboard.writeText(email);}catch(e){}
  }
  let text=`【写真種別】\n${sendSelectedType}\n\n【案件名・受付番号】\n${num}\n\n`;
  sel.forEach((p,i)=>{
   const d=new Date(p.created);
   const time=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
   text+=`■ 写真 ${i+1} (${p.stamp} - ${time})\n`;
   text+=p.coords?`Googleマップ: https://maps.google.com/?q=${p.coords.lat},${p.coords.lng}\n\n`:"Googleマップ: 位置情報なし\n\n";
  });
  const files=[];
  for(let i=0;i<sel.length;i++){
   const blob=await compressForEmail(sel[i].blob);
   files.push(new File([blob],`現場写真_${Date.now()}_${i+1}.jpg`,{type:"image/jpeg"}));
  }
  if(!navigator.canShare?.({files}))return toast("この端末ではファイル共有に対応していません");
  await navigator.share({title:`${num} 現場写真`,text,files});
  for(const p of sel){p.shared=true;await dbPut(p);}
  renderGallery();
 }catch(e){if(e.name!=="AbortError"){console.error(e);toast("共有処理に失敗しました");}}
 finally{btn.disabled=false;}
}

  const row=document.createElement("div");row.style.cssText="display:flex;gap:8px";
  const btn=document.createElement("button");btn.className="tool-btn";btn.style.flex="1";btn.textContent=t;
  btn.onclick=()=>{currentStamp=t;updateUI();closeM("modalStamp");};
  const del=document.createElement("button");del.className="icon-btn";del.textContent="🗑";
  del.onclick=()=>{customStamps.splice(i,1);localStorage.setItem("customStamps",JSON.stringify(customStamps));renderCustomStamps();};
  row.append(btn,del);list.appendChild(row);
 });
}

function addCustomStamp(){
 const input=$("newStampText"),v=input.value.trim();
 if(!v)return;
 if(v.length>30)return toast("スタンプは30文字以内にしてください");
 if(customStamps.includes(v))return toast("同じスタンプが登録されています");
 customStamps.push(v);localStorage.setItem("customStamps",JSON.stringify(customStamps));
 input.value="";renderCustomStamps();
}

function openM(id){$(id).classList.add("show");}
function closeM(id){$(id).classList.remove("show");}

function toast(msg){
 const t=$("toast");t.textContent=msg;t.style.display="block";
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2800);
}

document.addEventListener("visibilitychange",()=>{
 if(document.hidden)return;
 if(!editMode&&stream&&!video.srcObject){
  video.srcObject=stream;video.play().catch(()=>{});
 }
});

window.addEventListener("pagehide",()=>{
 if(gpsWatchId!==null)navigator.geolocation?.clearWatch(gpsWatchId);
});
</script>
</body>
